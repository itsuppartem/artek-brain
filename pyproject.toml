[project]
name = "artek-brain"
version = "0.1.0"
description = "Общий слой памяти и инструментов для людей и агентов (без LLM в ядре)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artek_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not load'"
markers = [
    "load: нагрузочные тесты; запуск: uv run pytest -m load (по одному, не параллельно)",
]

[project.scripts]
brain = "artek_brain.cli:main"
