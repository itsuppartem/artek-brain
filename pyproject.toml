[project]
name = "artek-brain"
version = "0.2.0"
description = "Shared, versioned memory for people and AI coding agents (MCP, CLI, HTTP); no LLM in the core"
license = "MIT"
authors = [{ name = "Artem Gulyaev", email = "94364802+itsuppartem@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artek_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not load'"
markers = [
    "load: нагрузочные тесты; запуск: uv run pytest -m load (по одному, не параллельно)",
]

[project.scripts]
brain = "artek_brain.cli:main"
